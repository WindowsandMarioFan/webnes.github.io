<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NES Emulator</title>
    <meta name="description" content="A fully functional NES emulator built from scratch with JavaScript">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>NES Emulator</h1>
            <p class="subtitle">Built from scratch with JavaScript</p>
        </header>

        <main>
            <div class="emulator-wrapper">
                <div class="screen-frame">
                    <canvas id="screen" width="256" height="240"></canvas>
                    <div class="screen-overlay"></div>
                </div>
                
                <div class="controls-panel">
                    <div class="control-group">
                        <label for="rom-input" class="file-label">
                            <span class="icon">📁</span>
                            <span>Load ROM</span>
                        </label>
                        <input type="file" id="rom-input" accept=".nes" hidden>
                        <span id="rom-name" class="rom-name">No ROM loaded</span>
                    </div>
                    
                    <div class="button-group">
                        <button id="btn-start" class="btn btn-primary" disabled>
                            <span class="icon">▶</span> Start
                        </button>
                        <button id="btn-pause" class="btn btn-secondary" disabled>
                            <span class="icon">⏸</span> Pause
                        </button>
                        <button id="btn-reset" class="btn btn-secondary" disabled>
                            <span class="icon">🔄</span> Reset
                        </button>
                    </div>
                </div>
            </div>

            <div class="info-panel">
                <div class="info-section">
                    <h3>Controls</h3>
                    <div class="controls-grid">
                        <div class="control-item"><kbd>↑</kbd><span>Up</span></div>
                        <div class="control-item"><kbd>↓</kbd><span>Down</span></div>
                        <div class="control-item"><kbd>←</kbd><span>Left</span></div>
                        <div class="control-item"><kbd>→</kbd><span>Right</span></div>
                        <div class="control-item"><kbd>Z</kbd><span>A Button</span></div>
                        <div class="control-item"><kbd>X</kbd><span>B Button</span></div>
                        <div class="control-item"><kbd>Enter</kbd><span>Start</span></div>
                        <div class="control-item"><kbd>Shift</kbd><span>Select</span></div>
                    </div>
                </div>

                <div class="info-section" id="debug-section">
                    <h3>Debug Info</h3>
                    <div id="debug-info" class="debug-info">
                        <div class="debug-row">
                            <span class="label">CPU:</span>
                            <span id="debug-cpu">--</span>
                        </div>
                        <div class="debug-row">
                            <span class="label">PPU:</span>
                            <span id="debug-ppu">--</span>
                        </div>
                        <div class="debug-row">
                            <span class="label">FPS:</span>
                            <span id="debug-fps">--</span>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>Use your own legally obtained ROM files</p>
        </footer>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
